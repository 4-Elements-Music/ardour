<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ardour Session Manager Dev Tool</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="top-bar">
    <span id="session-indicator">● No session</span>
    <button id="btn-play">Play</button>
    <button id="btn-stop">Stop</button>
    <button id="btn-save">Save</button>
    <label><input type="checkbox" id="gui-mode" checked> GUI mode</label>
  </div>
  <div id="main">
    <div id="left-panel">
      <h3>Sessions</h3>
      <div id="new-session">
        <label>Name: <input id="new-name" value="mix"></label>
        <label>SR: <select id="new-sr"><option>48000</option><option>44100</option></select></label>
        <label>BPM: <input id="new-bpm" type="number" value="120"></label>
        <button id="btn-new-session">New Session</button>
      </div>
      <ul id="session-list"></ul>
    </div>
    <div id="center-panel">
      <h3>Actions</h3>
      <div class="upload-control" style="margin: 8px 0;">
        <label for="upload-file" style="display: inline-block; width: 110px;">Upload file:</label>
        <input type="file" id="upload-file" accept="audio/wav,audio/mpeg,audio/flac,audio/aiff,audio/ogg,.wav,.mp3,.flac,.aiff,.ogg,.mid,.midi" />
        <span id="upload-status" style="margin-left: 8px; color: #666;"></span>
      </div>
      <div id="presets-section">
        <div class="presets-header">
          <span>Presets</span>
          <button id="btn-preset-capture" title="Capture current plugin state on the target track">★ Capture current</button>
        </div>
        <div class="presets-controls">
          <input id="preset-track" placeholder="target track name (e.g. 'Diva')" />
          <input id="preset-query" placeholder="search: warm bass, airy pad, ..." />
          <label class="preset-captured-only"><input type="checkbox" id="preset-captured-only"> captured only</label>
          <button id="btn-preset-search">Search</button>
        </div>
        <div id="preset-results"></div>
      </div>
      <div id="favorites-section">
        <div class="favorites-header">
          <span>Favorites</span>
          <button id="btn-save-favorite" title="Save current tool + params as a favorite">★ Save current</button>
        </div>
        <div id="favorites-list"></div>
      </div>
      <select id="tool-select"><option>Loading…</option></select>
      <div id="param-form"></div>
      <button id="btn-send">Send</button>
    </div>
    <div id="right-panel">
      <h3>Response Log</h3>
      <div class="log-controls">
        <button id="btn-copy-log">Copy All</button>
        <button id="btn-clear-log">Clear</button>
        <input id="log-filter" type="text" placeholder="Filter...">
      </div>
      <div id="log"></div>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
